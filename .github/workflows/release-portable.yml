name: Release Windows portable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore locked dependencies
        run: dotnet restore SimFlow.slnx --locked-mode

      - name: Run automated tests
        run: dotnet test SimFlow.slnx -c Release --no-restore

      - name: Check known vulnerable packages
        run: dotnet list SimFlow.slnx package --vulnerable --include-transitive --no-restore

      - name: Build portable application
        run: dotnet publish SimFlow.csproj -c Release --no-restore -p:Platform=x64 -p:PublishProfile=win-x64-portable

      - name: Verify portable branding assets
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/win-x64/portable"
          $requiredAssets = @(
            "$publishDir/Assets/SimFlow.ico",
            "$publishDir/Assets/Square150x150Logo.scale-200.png"
          )
          foreach ($asset in $requiredAssets) {
            if (-not (Test-Path $asset -PathType Leaf)) {
              throw "Portable build is missing required branding asset: $asset"
            }
          }

      - name: Package release and calculate SHA-256
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH.REVISION."
          }
          [xml]$manifest = Get-Content Package.appxmanifest
          if ($manifest.Package.Identity.Version -ne $version) {
            throw "Tag version $version does not match Package.appxmanifest version $($manifest.Package.Identity.Version)."
          }
          $archiveName = "SimFlow-$version-win-x64-portable.zip"
          $notesPath = "docs/RELEASE_NOTES_$version.md"
          if (-not (Test-Path $notesPath)) {
            throw "Missing release notes: $notesPath"
          }
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/win-x64/portable"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$publishDir/*" -DestinationPath "artifacts/$archiveName" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$archiveName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Path artifacts/SHA256SUMS.txt -Encoding ascii
          "archive=$archiveName" >> $env:GITHUB_OUTPUT
          "notes=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SimFlow-${{ github.ref_name }}-release-files
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/${{ steps.package.outputs.archive }}" `
            "artifacts/SHA256SUMS.txt" `
            --verify-tag `
            --title "SimFlow ${{ github.ref_name }}" `
            --notes-file "${{ steps.package.outputs.notes }}"
